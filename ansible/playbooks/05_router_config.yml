---
- name: Konfigurer VLAN-routing på routerne
  hosts: routers
  gather_facts: false

  tasks:

    - name: Sørg for at fysisk interface er aktivt
      cisco.ios.ios_config:
        parents:
          - "interface {{ parent_interface }}"
        lines:
          - no shutdown
        save_when: modified

    - name: Konfigurer router-subinterfaces
      cisco.ios.ios_config:
        parents:
          - "interface {{ item.interface }}"
        lines:
          - "encapsulation dot1Q {{ item.vlan }}"
          - "ip address {{ item.ip }} {{ item.mask }}"
          - no shutdown
        save_when: modified
      loop: "{{ router_subinterfaces }}"

    - name: Konfigurer statiske ruter
      cisco.ios.ios_config:
        lines:
          - "ip route {{ item.network }} {{ item.mask }} {{ item.next_hop }}"
        save_when: modified
      loop: "{{ static_routes }}"
